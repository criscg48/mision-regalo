<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Misión regalo</title>
  <!-- Materialize CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <!-- Tu CSS externo con fondo -->
  <link rel="stylesheet" type="text/css" href="../css/miEstilo.css">
  <style>
    /* Contenedor de tarjetas */
    .sortable-container {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 15px;
      margin-top: 20px;
      justify-items: stretch;
    }

    .sortable .card {
      cursor: grab;
      width: 100%;
      max-width: 220px;
      min-width: 0;
      margin: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;
      touch-action: none;
      transition: transform 160ms ease, opacity 160ms ease, box-shadow 160ms ease;
    }

    .sortable .card:active {
      cursor: grabbing;
    }

    .sortable .card.dragging {
      opacity: 0.55;
      transform: scale(1.04);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.35);
      z-index: 2;
    }

    .card.selected {
      border: 3px solid yellow;
      transform: scale(1.05);
    }

    .card-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      pointer-events: none;
    }

    .vacaciones-img {
      display: block;
      width: 100%;
      height: 150px;
      object-fit: contain;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.16);
    }

    .hidden {
      display: none;
    }

    @media (max-width: 768px) {
      .sortable-container {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .sortable .card {
        width: 100%;
      }

      .vacaciones-img {
        height: clamp(90px, 28vw, 140px);
      }
    }

    #codeContainer {
      margin-top: 20px;
    }

    .code-part {
      font-weight: bold;
    }
  </style>
</head>

<body class="mision-regalo">
  <div class="bg">
    <nav class="brown lighten-3">
      <div class="nav-wrapper">
        <a href="../index.html" class="brand-logo">
          <i class="material-icons">home</i>
        </a>
      </div>
    </nav>

    <main class="container center-align">
      <h2>📸 Juego: Ordena tus Vacaciones</h2>
      <p>Arrastra las fotos para ordenarlas, o toca dos para intercambiarlas 🏖️</p>

      <!-- Contenedor de tarjetas DESORDENADAS -->
      <div class="sortable sortable-container">
        <div class="card teal brown lighten-2 white-text">
          <div class="card-content">
            <span class="card-title">Lisboa</span>
            <img src="../media/2.jpg" class="vacaciones-img">
          </div>
        </div>
        <div class="card teal brown lighten-2 white-text">
          <div class="card-content">
            <span class="card-title">Sevilla</span>
            <img src="../media/1.jpg" class="vacaciones-img">
          </div>
        </div>
        <div class="card teal brown lighten-2 white-text">
          <div class="card-content">
            <span class="card-title">Londres</span>
            <img src="../media/4.jpg" class="vacaciones-img">
          </div>
        </div>
        <div class="card teal brown lighten-2 white-text">
          <div class="card-content">
            <span class="card-title">Gibraltar</span>
            <img src="../media/3.jpg" class="vacaciones-img">
          </div>
        </div>
        <div class="card teal brown lighten-2 white-text">
          <div class="card-content">
            <span class="card-title">Budapest</span>
            <img src="../media/6.jpg" class="vacaciones-img">
          </div>
        </div>
        <div class="card teal brown lighten-2 white-text">
          <div class="card-content">
            <span class="card-title">Cabo de Gata</span>
            <img src="../media/5.jpg" class="vacaciones-img">
          </div>
        </div>
      </div>

      <br>
      <button id="checkOrder" class="btn brown lighten-1">Comprobar Orden</button>

      <!-- Código secreto -->
      <div id="codeContainer" class="hidden">
        <h5>🎉 ¡Has ordenado todas las fotos correctamente!</h5>
        <p class="brown lighten-2 white-text">El código secreto es: <span id="secretCode" class="code-part">2</span></p>
      </div>
    </main>
  </div>

  <!-- Materialize JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>

  <script>
    const sortable = document.querySelector(".sortable");
    const checkBtn = document.getElementById("checkOrder");
    const codeContainer = document.getElementById("codeContainer");

    let firstSelected = null;
    let draggedCard = null;
    let startX = 0;
    let startY = 0;
    let didDrag = false;
    let suppressClick = false;

    function swapContents(firstCard, secondCard) {
      const firstContent = firstCard.querySelector(".card-content");
      const secondContent = secondCard.querySelector(".card-content");
      const tempHTML = firstContent.innerHTML;
      firstContent.innerHTML = secondContent.innerHTML;
      secondContent.innerHTML = tempHTML;
    }

    sortable.addEventListener("pointerdown", event => {
      const card = event.target.closest(".card");
      if (!card || event.button !== 0) return;

      draggedCard = card;
      startX = event.clientX;
      startY = event.clientY;
      didDrag = false;
      card.setPointerCapture(event.pointerId);
    });

    sortable.addEventListener("pointermove", event => {
      if (!draggedCard) return;

      if (!didDrag && Math.hypot(event.clientX - startX, event.clientY - startY) > 8) {
        didDrag = true;
        draggedCard.classList.add("dragging");
        if (firstSelected) {
          firstSelected.classList.remove("selected");
          firstSelected = null;
        }
      }
      if (!didDrag) return;

      const targetCard = document.elementFromPoint(event.clientX, event.clientY)?.closest(".card");
      if (targetCard && targetCard !== draggedCard && targetCard.parentElement === sortable) {
        const cards = [...sortable.querySelectorAll(".card")];
        const fromIndex = cards.indexOf(draggedCard);
        const toIndex = cards.indexOf(targetCard);
        if (fromIndex < toIndex) sortable.insertBefore(draggedCard, targetCard.nextSibling);
        else sortable.insertBefore(draggedCard, targetCard);
      }
    });

    function finishPointer(event) {
      if (!draggedCard) return;
      const card = draggedCard;
      const wasDrag = didDrag;
      card.classList.remove("dragging");
      draggedCard = null;
      didDrag = false;

      if (wasDrag) {
        suppressClick = true;
        window.setTimeout(() => { suppressClick = false; }, 0);
      }
      if (card.hasPointerCapture(event.pointerId)) card.releasePointerCapture(event.pointerId);
    }

    sortable.addEventListener("pointerup", finishPointer);
    sortable.addEventListener("pointercancel", finishPointer);

    // Alternativa accesible: tocar dos tarjetas las intercambia.
    sortable.addEventListener("click", event => {
      const card = event.target.closest(".card");
      if (!card || suppressClick) return;

      if (!firstSelected) {
        firstSelected = card;
        card.classList.add("selected");
      } else if (firstSelected === card) {
        card.classList.remove("selected");
        firstSelected = null;
      } else {
        swapContents(firstSelected, card);
        firstSelected.classList.remove("selected");
        firstSelected = null;
      }
    });

    // Comprobar orden basado en el número de la foto
    checkBtn.addEventListener("click", () => {
      const items = sortable.querySelectorAll(".card");
      let correct = true;

      items.forEach((item, index) => {
        const imgSrc = item.querySelector("img").src;
        const match = imgSrc.match(/(\d+)\.jpg$/);
        const num = match ? parseInt(match[1]) : 0;
        if (num !== index + 1) correct = false;
      });

      if (correct) {
        M.toast({ html: "✅ ¡Orden correcto!" });
        codeContainer.classList.remove("hidden");
      } else {
        M.toast({ html: "❌ El orden no es correcto, inténtalo de nuevo." });
        codeContainer.classList.add("hidden");
      }
    });
  </script>
</body>

</html>
